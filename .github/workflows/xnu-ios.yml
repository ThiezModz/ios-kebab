name: xnu-ios

# Build the ios-kebab XNU as an iOS-target kernel (SDKROOT=iphoneos), the
# way hakios does (oosexgang/hakios-xnu-kernel). The dxb macOS build keeps
# the arm64 trust-cache gate compiled in (XNU_TARGET_OS_OSX), which rejects
# every dyld shared cache file and stalls launchd in QEMU with
# shared_region_check_np = ENOMEM. The iPhoneOS SDK build compiles the gate
# out; the CSR/root checks then follow the iOS path, and the full iOS
# userspace (launchd -> SpringBoard) can boot in QEMU and on the phone.
# The macOS build (xnu.yml) stays for the phone fastboot path.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "drivers/**"
      - ".github/workflows/xnu-ios.yml"

concurrency:
  group: xnu-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  MACHINE_CONFIG: SWEET
  MACOS_VERSION: "13.5"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ldid 2>/dev/null || true
          # Xcode is preinstalled; its cctools do the assembling/linking
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Fetch the iPhoneOS SDK (16.5, the xnu-8796 era)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdk-theos-git
          git -C sdk-theos-git sparse-checkout set iPhoneOS16.5.sdk
          # the partial clone must materialize the blobs; retry the checkout
          # once if the tree came up empty (a silent failure mode)
          test -f sdk-theos-git/iPhoneOS16.5.sdk/SDKSettings.plist || git -C sdk-theos-git checkout -q -f
          test -f sdk-theos-git/iPhoneOS16.5.sdk/SDKSettings.plist || { echo "SDK checkout is empty"; exit 1; }
          echo "IOS_SDK=$PWD/sdk-theos-git/iPhoneOS16.5.sdk" >> "$GITHUB_ENV"

      - name: The xnu SDK overlay (availability.pl + the firehose headers)
        run: |
          # what Apple's internal SDK has and the public one lacks
          mkdir -p "$IOS_SDK/usr/local/include/kernel/os" "$IOS_SDK/usr/local/include/os" \
            "$IOS_SDK/usr/local/lib/kernel" "$IOS_SDK/usr/local/libexec"
          git init -q av && (cd av && git remote add origin https://github.com/apple-oss-distributions/AvailabilityVersions.git && \
            git fetch -q --depth 1 origin 5d9baee345b3bc72b26c71adc65f94f2d5e9ced2 && git checkout -q FETCH_HEAD)
          cp av/availability.pl "$IOS_SDK/usr/local/libexec/" && chmod +x "$IOS_SDK/usr/local/libexec/availability.pl"
          git init -q ld && (cd ld && git remote add origin https://github.com/apple-oss-distributions/libdispatch.git && \
            git fetch -q --depth 1 origin a641558f447659d90ad002ef0ee6f0212273fbfc && git checkout -q FETCH_HEAD)
          (unifdef -DOS_FIREHOSE_SPI=1 -DKERNEL=1 ld/os/firehose_buffer_private.h || [ $? -eq 1 ]) > \
            "$IOS_SDK/usr/local/include/kernel/os/firehose_buffer_private.h"
          cp ld/src/firehose/firehose_types.defs "$IOS_SDK/usr/local/include/kernel/os/firehose_types.defs"
          ls "$IOS_SDK/usr/local/libexec/"

      - name: Fetch xnu (the macos-13.5 release, like the dxb build)
        run: |
          REL=https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-135/release.json
          TAG=$(curl -s "$REL" | jq -r '.projects[] | select(.project=="xnu") | .tag')
          echo "xnu tag: $TAG"
          git clone -q --depth 1 --branch "$TAG" https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src
          git log --oneline -1

      - name: Stage + patch
        run: |
          # the stagers assume the dxb layout: the scripts live in a
          # patches/ subdir and the drivers sit two levels up from it
          mkdir -p xnu-src/patches
          cp xnu/patches/*.patch xnu/patches/*.sh xnu-src/patches/
          cd xnu-src
          for s in patches/*.sh; do
            echo "== $s"; bash "$s" || { echo "stager $s failed"; exit 1; }
          done
          for p in patches/*.patch; do
            if git apply --check "$p" 2>/dev/null; then
              git apply "$p" && echo "applied $p"
            else
              echo "WARNING: skipping $p (does not apply)" | tee -a ../skipped.txt
            fi
          done
          ls bsd/dev/kebab/ | head

      - name: Build (iOS target, SWEET machine config)
        working-directory: xnu-src
        run: |
          # The makefiles ask XCRUN (makedefs/MakeInc.cmd) for the SDK path,
          # version and platform. Apple's xcrun cannot resolve the theos 16.5
          # SDK (it lives outside Xcode), so this wrapper answers the iphoneos
          # queries from the env and delegates everything else to the real
          # xcrun (the hakios model: their host/bin/xcrun does the same).
          cat > xcrun-ios <<'EOF'
          #!/bin/bash
          orig=("$@")
          sdk=""; show=""
          while [ $# -gt 0 ]; do case "$1" in
            -sdk) sdk="$2"; shift 2;; -verbose) shift;;
            -show-sdk-path|--show-sdk-path) show=path; shift;;
            -show-sdk-version|--show-sdk-version) show=version; shift;;
            -show-sdk-platform-path|--show-sdk-platform-path) show=platform; shift;;
            -show-sdk-platform-version) show=platformversion; shift;;
            *) break;; esac; done
          case "$sdk" in
            iphoneos*)
              case "$show" in
                path) echo "$IOS_SDK"; exit 0;;
                version) echo "16.5"; exit 0;;
                platform) echo "$PWD/../sdk/Platforms/iPhoneOS.platform"; exit 0;;
                platformversion) echo "16.5"; exit 0;;
              esac;;
          esac
          # make exports the resolved SDKROOT into the environment; the real
          # xcrun would pick that up instead of its own SDKs and fail.
          # Delegate the ORIGINAL query (the shifts above consume "$@").
          unset SDKROOT
          exec /usr/bin/xcrun "${orig[@]}"
          EOF
          EOF
          chmod +x xcrun-ios
          mkdir -p ../sdk/Platforms/iPhoneOS.platform

          # xnu-clang: the Xcode clang targeting arm64-apple-ios16
          printf '#!/bin/bash\nexec xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$IOS_SDK" "$@"\n' > /usr/local/bin/xnu-clang
          printf '#!/bin/bash\nexec xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$IOS_SDK" "$@"\n' > /usr/local/bin/xnu-clang++
          chmod +x /usr/local/bin/xnu-clang /usr/local/bin/xnu-clang++
          make SDKROOT=iphoneos XCRUN="$PWD/xcrun-ios" \
            ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=SWEET \
            KERNEL_CONFIGS=DEVELOPMENT ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG=arm64 \
            BUILD_WERROR=0 BUILD_LTO=0 DO_CTFMERGE=0 CC=xnu-clang CXX=xnu-clang++ \
            HOST_CC=clang HOST_CXX=clang++ LOGCOLORS=n all
          ls BUILD/obj/DEVELOPMENT_ARM64_SWEET/ | head

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp xnu-src/BUILD/obj/DEVELOPMENT_ARM64_SWEET/mach.development.sweet out/kernel.development.sweet 2>/dev/null || \
            cp xnu-src/BUILD/obj/DEVELOPMENT_ARM64_SWEET/mach.development out/kernel.development.sweet 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-ios
          path: out/
          if-no-files-found: warn
